[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = true
    enabled = true
    match = "runelite"
    override_duration = 2000
    play_sound = true
    save_history = true
    show_toast = true

[plugins]
enabled = [
    "noctalia/kaomoji",
    "noctalia/translator",
    "noctalia/timer",
    "noctalia/notes",
    "noctalia/screen_recorder",
    "noctalia/bongocat"
]

[shell]
ui_scale = 1.0500000081956387

    [shell.panel]
    clipboard_placement = "attached"
    floating_offset = 1
    polkit_placement = "attached"
    shadow = false

[theme]
builtin = "Eldritch"
community_palette = "Ayu Green"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "mango", "niri", "qt" ]

