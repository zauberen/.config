[weather]
unit = "imperial"

[widget.brightness]
enabled = false
show_label = false

[widget.cat]
color = "primary"
enabled = true
input_devices = [
    "/dev/input/by-path/platform-i8042-serio-0-event-kbd",
    "/dev/input/by-path/pci-0000:00:15.0-platform-i2c_designware.0-event"
]
type = "noctalia/bongocat:cat"

[widget.cat_2]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%a %I:%M%P}"

[widget.control-center]
color = "primary"

[widget.session]
color = "secondary"

[widget.tray]
drawer = true
enabled = true

[widget.wallpaper]
enabled = false